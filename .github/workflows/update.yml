name: Update IPTV Playlist

on:
  workflow_dispatch:

  schedule:
    # 03:00 UTC = 00:00 Brasil (UTC-3)
    - cron: '0 15 * * 1,5'

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: Build Playlist
    runs-on: ubuntu-latest

    timeout-minutes: 360

    env:
      # FIX: aumentado de 16 para 64 — reduz tempo de validação ~4x
      PARALLEL_JOBS: 64
      CACHE_MAX_AGE_DAYS: 2

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "===== SYSTEM ====="
          uname -a

          echo
          echo "===== BASH ====="
          bash --version | head -n 1

          echo
          echo "===== CPU ====="
          nproc

          echo
          echo "===== ROOT FILES ====="
          ls -lah

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            gawk \
            jq \
            shellcheck

      - name: Verify required files
        run: |
          test -f update_playlist.sh || {
            echo "ERRO: update_playlist.sh não encontrado"
            exit 1
          }

      - name: Fix CRLF
        run: |
          sed -i 's/\r$//' update_playlist.sh

      - name: Make script executable
        run: |
          chmod +x update_playlist.sh

      - name: Run ShellCheck
        run: |
          shellcheck -S error update_playlist.sh

      - name: Create empty runtime files
        run: |
          touch blacklist.txt
          touch cache_ok.txt

      - name: Run playlist update
        run: |
          ./update_playlist.sh

      - name: Verify generated files
        run: |
          echo
          echo "===== GENERATED FILES ====="
          ls -lah

          test -f master.m3u || {
            echo "ERRO: master.m3u não foi gerado"
            exit 1
          }

          echo
          echo "===== MASTER SIZE ====="
          du -h master.m3u

          echo
          echo "===== CHANNEL COUNT ====="
          grep -c '^#EXTINF' master.m3u || true

          echo
          echo "===== BLACKLIST ====="
          wc -l blacklist.txt || true

          echo
          echo "===== CACHE ====="
          wc -l cache_ok.txt || true

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            master.m3u \
            blacklist.txt \
            cache_ok.txt \
            update.log

          if git diff --cached --quiet; then
            echo "Nenhuma alteração detectada"
            exit 0
          fi

          git commit -m "Auto update IPTV playlist"

          git push origin HEAD:${{ github.ref_name }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-output
          retention-days: 7
          if-no-files-found: warn
          path: |
            master.m3u
            blacklist.txt
            cache_ok.txt
            update.log
