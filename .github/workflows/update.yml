name: Atualizar Playlist

on:
  schedule:
    # Sexta-feira às 12:00 UTC (09:00 Horário de Brasília)
    - cron: "0 12 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Rodar script de atualização
        run: |
          chmod +x update_playlist.sh
          ./update_playlist.sh

      - name: Commit e Push das mudanças (Playlist e Blacklist)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sincroniza com o repositório remoto
          git pull --rebase || true

          # Adiciona os arquivos gerados/modificados
          git add master.m3u blacklist.txt
          
          # Só faz o commit se houver alterações reais
          git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M:%S UTC') [Bot]" || exit 0
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
