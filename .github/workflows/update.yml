name: Atualizar Playlist

on:
  schedule:
    # Sextas-feiras às 12:00 UTC (09:00 Horário de Brasília)
    - cron: "0 12 * * 5"
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Rodar script de atualização
        run: |
          chmod +x update_playlist.sh
          ./update_playlist.sh

      - name: Commit e Push das mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull --rebase origin main || true
          
          # Adiciona playlist e a lista de reteste
          git add master.m3u blacklist.txt
          
          git commit -m "Limpeza Semanal: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
