name: Update Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: update-playlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      PARALLEL_JOBS: 24
      CACHE_MAX_AGE_DAYS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gawk shellcheck gettext-base

      - name: Validate script syntax
        run: |
          test -f ./update_playlist.sh
          bash -n ./update_playlist.sh
          chmod +x ./update_playlist.sh

      - name: Run ShellCheck
        run: |
          shellcheck ./update_playlist.sh

      - name: Run update script
        run: ./update_playlist.sh

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-output
          path: |
            master.m3u
            blacklist.txt
            cache_ok.txt
            update.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=()
          [ -f master.m3u ] && files+=(master.m3u)
          [ -f blacklist.txt ] && files+=(blacklist.txt)
          [ -f cache_ok.txt ] && files+=(cache_ok.txt)
          [ -f update.log ] && files+=(update.log)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo gerado."
            exit 0
          fi

          git add -- "${files[@]}"

          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commit."
            exit 0
          fi

          git commit -m "Update playlist"
          git push
