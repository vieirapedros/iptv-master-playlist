name: Update Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate script
        run: |
          test -f ./update_playlist.sh
          bash -n ./update_playlist.sh
          chmod +x ./update_playlist.sh

      - name: Run update script
        run: ./update_playlist.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=()
          [ -f master.m3u ] && files+=(master.m3u)
          [ -f blacklist.txt ] && files+=(blacklist.txt)
          [ -f update.log ] && files+=(update.log)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo gerado."
            exit 0
          fi

          git add -- "${files[@]}"

          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commit."
            exit 0
          fi

          git commit -m "Update playlist"
          git push
