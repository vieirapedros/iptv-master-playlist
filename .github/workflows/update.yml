name: Update IPTV Playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1,5'
permissions:
  contents: write
  actions: write
concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  update:
    name: Build and validate playlist
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PARALLEL_JOBS: 64
      CACHE_MAX_AGE_DAYS: 2
      BLACKLIST_TTL_DAYS: 7
      MIN_DIFF_PCT: 50
      MEDIA_JOBS: 4
      MEDIA_SECONDS: 20
      MEDIA_TIMEOUT_SECONDS: 75
    steps:
      - uses: actions/checkout@v4
      - name: Restore HTTP state
        uses: actions/cache/restore@v4
        with:
          path: |
            blacklist.txt
            cache_ok.txt
          key: iptv-state-v2-${{ github.run_id }}
          restore-keys: |
            iptv-state-v2-
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate syntax and lifecycle
        run: |
          bash -n update_playlist.sh
          python3 -m py_compile media_gate.py run_validated_update.py
          python3 test_media_gate.py
          test -f validation_state/media.json
      - name: Run selective validation
        run: python3 run_validated_update.py
      - name: Update README statistics
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          m=json.loads(Path('reports/media_summary.json').read_text())
          total=sum(s.startswith('#EXTINF:') for s in Path('master.m3u').read_text().splitlines())
          if not total:
              raise SystemExit('Playlist vazia')
          stamp=datetime.now(ZoneInfo('America/Sao_Paulo')).strftime('%d/%m/%Y às %H:%M (Brasília)')
          start,end='<!-- PLAYLIST-STATS:START -->','<!-- PLAYLIST-STATS:END -->'
          block='\n'.join([start,'## Última atualização','',f'- Atualizada em: {stamp}',f'- Entradas totais: {total}',f'- Aprovadas em teste de mídia (23 países): {m["approved"]}',f'- Publicadas com filtro HTTP, sem teste de mídia (WORLD e IPTV-ORG): {total-m["approved"]}',f'- URLs em quarentena: {m["quarantine"]}',f'- URLs descartadas: {m["discarded"]}','','Contagens de URLs, não emissoras. Mídia: amostra de 20 segundos; HTTP mantém cache e exceções do script. Política em VALIDATION.md.',end])
          p=Path('README.md'); text=p.read_text(encoding='utf-8')
          if start in text and end in text:
              a=text.index(start); b=text.index(end,a)+len(end)
              text=text[:a]+block+text[b:]
          elif start in text or end in text:
              raise SystemExit('Marcadores incompletos no README')
          else:
              head,sep,rest=text.partition('\n')
              text=head+'\n\n'+block+'\n'+sep+rest
          p.write_text(text,encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(block)
          PY
      - name: Commit playlist and persistent media state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.m3u update.log README.md
          git add -f validation_state/media.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update playlist and media validation state'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Save HTTP state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            blacklist.txt
            cache_ok.txt
          key: iptv-state-v2-${{ github.run_id }}
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-validation-report
          path: reports/
          retention-days: 7
      - name: Clean old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --limit 1000 --json databaseId,createdAt \
            --jq '.[] | select((now - (.createdAt | fromdateiso8601)) > 2592000) | .databaseId' \
          | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}"
            done
