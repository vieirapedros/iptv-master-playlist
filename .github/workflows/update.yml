name: Atualizar Playlist

on:
  schedule:
    # 0 -> Minuto 0
    # 12 -> Hora 12 (Meio-dia UTC)
    # * -> Qualquer dia do mês
    # * -> Qualquer mês
    # 5 -> Sexta-feira (0 é Domingo, 5 é Sexta)
    - cron: "0 12 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Rodar script
        run: |
          chmod +x update_playlist.sh
          ./update_playlist.sh

      - name: Commit e Push das mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git stash || true
          git pull --rebase || true
          git stash pop || true

          git add master.m3u
          git commit -m "Atualização automática da playlist $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
