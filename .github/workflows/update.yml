name: Update IPTV Playlist

on:
  workflow_dispatch:

  schedule:
    # 15:00 UTC = 12:00 BRT (segunda e sexta)
    - cron: '0 15 * * 1,5'

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: Build Playlist
    runs-on: ubuntu-latest

    timeout-minutes: 360

    env:
      PARALLEL_JOBS: 64
      CACHE_MAX_AGE_DAYS: 2
      BLACKLIST_TTL_DAYS: 7
      MIN_DIFF_PCT: 50

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Estado (blacklist/cache) fora do histórico git — antes eram ~25 MB por commit
      - name: Restore state (blacklist/cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            blacklist.txt
            cache_ok.txt
          key: iptv-state-${{ github.run_id }}
          restore-keys: |
            iptv-state-

      - name: Show environment
        run: |
          uname -a
          bash --version | head -n 1
          nproc
          awk --version | head -n 1

      - name: Make script executable
        run: chmod +x update_playlist.sh

      # -S warning pega mais problemas; não bloqueia o job
      - name: Run ShellCheck
        continue-on-error: true
        run: shellcheck -S warning update_playlist.sh

      - name: Run playlist update
        run: ./update_playlist.sh
        # O script aborta se o resultado for vazio ou < MIN_DIFF_PCT% do anterior

      - name: Verify generated files
        run: |
          test -f master.m3u || { echo "ERRO: master.m3u não foi gerado"; exit 1; }
          du -h master.m3u
          echo "Canais: $(grep -c '^#EXTINF' master.m3u || true)"
          echo "Blacklist: $(wc -l < blacklist.txt || true) linhas"
          echo "Cache: $(wc -l < cache_ok.txt || true) linhas"

      - name: Commit playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.m3u update.log

          if git diff --cached --quiet; then
            echo "Nenhuma alteração detectada"
            exit 0
          fi

          git commit -m "Auto update IPTV playlist"
          git push origin HEAD:${{ github.ref_name }}

      - name: Save state (blacklist/cache)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            blacklist.txt
            cache_ok.txt
          key: iptv-state-${{ github.run_id }}
