name: Update Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate files
        run: |
          test -f ./update_playlist.sh
          chmod +x ./update_playlist.sh

      - name: Run playlist update
        run: |
          set -euo pipefail
          ./update_playlist.sh

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          files=()
          [ -f master.m3u ] && files+=(master.m3u)
          [ -f blacklist.txt ] && files+=(blacklist.txt)
          [ -f update.log ] && files+=(update.log)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "Update playlist"
              git push
            fi
          fi
